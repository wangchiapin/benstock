name: 每日更新股價資料

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 台灣時間每週一到週五 16:00（收盤後）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: data-fetch          # 跟「回測」共用，避免兩個同時寫資料
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所資料
        run: python scripts/fetch.py
      - name: 有變動就存回 repo
        if: always()         # 就算中途失敗，已經抓到的也先存起來
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新股價資料 $(date -u +%F)"
            git push
          fi
