name: 每日更新股價資料

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 台灣時間每週一到週五 16:00（收盤後）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: data-fetch          # 跟「回測」共用，避免兩個同時寫資料
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所資料
        run: python scripts/fetch.py
      - name: 抓三大法人買賣超和月營收（實驗用，原本的排名不會用到）
        continue-on-error: true   # 這步失敗不影響股價資料和往後記錄
        run: python scripts/fetch_extra.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 記錄今天的排名前幾檔，並更新往後記錄的成績
        continue-on-error: true   # 這步失敗不影響上面抓到的股價資料存檔
        run: |
          python scripts/fetch.py --export "$RUNNER_TEMP/history.json" --keep 200
          node scripts/record.js "$RUNNER_TEMP/history.json" index.html data/forward.json
      - name: 有變動就存回 repo
        if: always()         # 就算中途失敗，已經抓到的也先存起來
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新股價資料 $(date -u +%F)"
            git push
          fi
